<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOF Dashboard</title>
<meta name="theme-color" content="#0b0e14">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="preconnect" href="https://fapi.binance.com">
</head>
<body>
<header class="top">
  <div class="brand">LOF<span>Confluence</span></div>
  <div class="search">
    <input id="q" placeholder="Search coin or market" autocomplete="off" spellcheck="false">
    <kbd>/</kbd>
    <div id="qres" class="dropdown"></div>
  </div>
  <div id="quick" class="quick"></div>
  <div class="hdr-right">
    <div id="kz" class="kz" title="Killzones (New York time): London 02:00–05:00 · New York 07:00–10:00 · Asia 20:00–00:00"></div>
    <div id="news" class="kz news" title="Next high-impact USD news (Forex Factory)"></div>
    <div class="clockw"><button id="clock" class="kz clock" title="Time zone"></button><div id="clockPop" class="pop clock-pop" hidden></div></div>
    <div id="status" class="status"><span class="dot"></span><span class="txt">Starting</span><div class="tip"></div></div>
    <button id="btnAlerts" class="icon-btn bell" title="Alerts (Alt+A on the chart adds one)">🔔</button>
    <button id="btnTheme" class="icon-btn" title="Light / dark">☀</button>
    <button id="btnSettings" class="icon-btn" title="Settings">⚙</button>
  </div>
</header>


<main class="grid">
  <section class="left">
    <div id="hero" class="hero"></div>
    <div id="overview" class="tiles"></div>

    <div class="card chart-card">
      <div class="chart-bar">
        <div id="tfs" class="seg"></div>
        <div class="menu" id="mPanes"><button class="btn">Panes ▾</button><div class="pop"></div></div>
        <div class="menu" id="mLayers"><button class="btn">Layers ▾</button><div class="pop"></div></div>
        <div class="menu" id="mInd"><button class="btn">Indicators ▾</button><div class="pop"></div></div>
        <span class="sp"></span>
        <div id="layouts" class="seg" title="Chart layout: 1, 2 or 4 charts"></div>
        <div id="sizes" class="seg" title="Chart size"></div>
      </div>
      <div id="chartGrid" class="chart-grid l1"><div id="chart" class="chart-host cell main"><div class="loading">Loading chart…</div></div></div>
      <datalist id="miniSyms"></datalist>
      <div id="chartFoot" class="chart-foot"></div>
    </div>

    <div class="card" id="flowCard">
      <h3>Derivatives &amp; order flow <span id="flowSrc" class="src"></span></h3>
      <div id="flow" class="tiles"></div>
      <div id="notes"></div>
    </div>

    <div class="card" id="tabsCard">
      <div class="tabs" id="tabs">
        <button data-tab="screener" class="on">Screener</button>
        <button data-tab="pulse">Sentiment</button>
        <button data-tab="calendar">Calendar</button>
        <button data-tab="history">Setup history</button>
        <button data-tab="markets">Data sources</button>
      </div>
      <div id="tab-screener"><div id="scanEdit"></div><div id="scanBody"></div></div>
      <div id="tab-pulse" hidden></div>
      <div id="tab-calendar" hidden></div>
      <div id="tab-history" hidden></div>
      <div id="tab-markets" hidden></div>
    </div>
  </section>

  <aside class="right">
    <div id="wlPanel" class="card wl">
      <div class="wl-head">
        <button id="wlName" class="wl-name" title="Switch, create, rename or delete lists">Watchlist ▾</button>
        <span class="sp"></span>
        <button id="wlAdd" class="icon-btn" title="Add symbol">＋</button>
      </div>
      <div id="wlMenu" class="pop wl-menu" hidden></div>
      <div id="wlSearch" class="wl-search" hidden><input placeholder="Add symbol, e.g. SOL or GOLD" spellcheck="false" autocomplete="off"><div class="res"></div></div>
      <div class="wl-cols"><span data-s="sym">Symbol</span><span data-s="last">Last</span><span data-s="chg">Chg%</span><span data-s="vol">Vol</span><span></span></div>
      <div id="wlRows" class="wl-rows"></div>
    </div>
    <div id="plan" class="card"></div>
    <div id="checklist" class="card"></div>
    <div id="bias" class="card"></div>
    <div id="levels" class="card"></div>
  </aside>
</main>

<div id="drawer" class="drawer"></div>
<div id="alertsPanel" class="alerts-panel" hidden></div>
<div id="modal" class="modal" hidden></div>
<div id="toast" class="toast"></div>

<script src="/js/lwc.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
